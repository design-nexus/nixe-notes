name: Notes checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    container: archlinux@sha256:e43f1fd80e073992c5f173efbbbf65144170bf60aeb7369940087d63eacea8f4
    steps:
      - name: Install native dependencies
        run: |
          printf 'Server = https://archive.archlinux.org/repos/2026/10/20/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed git rust gtk4 gtksourceview5 python dbus base-devel
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Format, lint, and focused tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          python3 tools/check-gtk.py
      - name: Build release
        run: cargo build --release --locked -p nyx-notes -p nyx-notes-glimpse
