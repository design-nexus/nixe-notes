[package]
name = "nyx-notes"
version = "0.5.5"
description = "A native, local-first Markdown writing workspace"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gtk.workspace = true
sourceview5.workspace = true
nyx-core.workspace = true
nyx-ui.workspace = true
nyx-theme.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
async-channel.workspace = true
notes-editor = { path = "../notes-editor" }
notes-vault = { path = "../notes-vault" }
notes-ai = { path = "../notes-ai", optional = true }
notes-sync = { path = "../notes-sync", optional = true }
notes-plugins = { path = "../notes-plugins", optional = true }
pangocairo = "0.22"

[dev-dependencies]
tempfile = "3"

[features]
default = ["ai", "sync", "plugins"]
ai = ["dep:notes-ai"]
sync = ["dep:notes-sync"]
plugins = ["dep:notes-plugins"]
