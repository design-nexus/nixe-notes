[package]
name = "notes-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
nixe-cloud = { git = "https://github.com/design-nexus/nixe-cloud.git", rev = "053a31d9704c5f0379c1b17e70a659b353357881" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
gio.workspace = true
notes-vault = { path = "../notes-vault" }
nixe-sync = { git = "https://github.com/design-nexus/nixe-core.git", rev = "87682e6c936b6a4f006639b1a1c099e96346c07c" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2"
percent-encoding = "2"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
rustix = { version = "1", features = ["fs"] }
