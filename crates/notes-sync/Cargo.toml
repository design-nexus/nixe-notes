[package]
name = "notes-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
nyx-cloud = { git = "https://github.com/design-nexus/nyx-cloud.git", rev = "072cb06bf7a975e536b8fcdd2d19ec7a911e14d7" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
gio.workspace = true
notes-vault = { path = "../notes-vault" }
nyx-sync = { git = "https://github.com/design-nexus/nyx-core.git", rev = "52cba5e27a3dd5f00c780f53e423302b4b5f9c9c" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2"
percent-encoding = "2"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
rustix = { version = "1", features = ["fs"] }
