[workspace]
resolver = "3"
members = ["crates/notes-app", "crates/notes-editor", "crates/notes-markdown", "crates/notes-vault", "crates/notes-ai", "crates/notes-glimpse", "crates/notes-sync", "crates/notes-plugins"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Ken Smith"]
repository = "https://github.com/design-nexus/nixe-notes"

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
gio = "0.22"
sourceview5 = "0.11"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
blake3 = "1"
nixe-core = { git = "https://github.com/design-nexus/nixe-core.git", rev = "87682e6c936b6a4f006639b1a1c099e96346c07c" }
nixe-ui = { git = "https://github.com/design-nexus/nixe-design.git", rev = "b8204de80644e263e32783602f2e0ae393578c9e" }
nixe-theme = { git = "https://github.com/design-nexus/nixe-design.git", rev = "b8204de80644e263e32783602f2e0ae393578c9e" }

[profile.release]
lto = "thin"
strip = true

